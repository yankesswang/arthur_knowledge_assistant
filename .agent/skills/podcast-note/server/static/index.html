<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Notes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c6af7'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' font-size='20'>🎙</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#22253a; --border:#2e3145;
  --accent:#7c6af7; --accent-dim:#2e2860; --text:#e2e4f0; --text-dim:#8b8fa8;
  --text-muted:#555870; --green:#4ade80; --yellow:#fbbf24; --red:#f87171;
  --blue:#60a5fa; --read-bg:#1a2a1a; --unread-bg:#1a1d27;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

/* ── TOP NAV ── */
#nav{height:48px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:0;position:sticky;top:0;z-index:100}
#nav h1{font-size:15px;font-weight:700;margin-right:24px;white-space:nowrap}
.nav-tab{padding:6px 14px;font-size:13px;cursor:pointer;color:var(--text-dim);border-bottom:2px solid transparent;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav-tab-yt{background:rgba(124,106,247,.12);border-radius:6px;margin-right:10px;color:var(--accent)!important;border-bottom:2px solid transparent!important}
.nav-tab-yt:hover{background:rgba(124,106,247,.2)}
.nav-tab-yt.active{background:rgba(124,106,247,.22);border-bottom-color:var(--accent)!important}
#nav-search{margin-left:auto;position:relative}
#nav-search input{padding:6px 10px 6px 30px;border-radius:6px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:12px;outline:none;width:200px}
#nav-search input:focus{border-color:var(--accent)}
#nav-search input::placeholder{color:var(--text-muted)}
#nav-search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);opacity:.4;pointer-events:none}

/* ── PAGE WRAPPER ── */
.page{display:none;padding:24px 20px 60px;max-width:1200px;margin:0 auto}
.page.active{display:block}

/* ── CARDS GRID ── */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:32px}
.source-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .2s;position:relative}
.source-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.source-card.expanded{border-color:var(--accent)}
.card-art{width:100%;aspect-ratio:1;object-fit:cover;background:var(--surface2);display:block}
.card-art-yt{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--surface2);display:block}
.card-body{padding:10px 12px 12px}
.card-name{font-size:12px;font-weight:700;line-height:1.4;margin-bottom:4px}
.card-stats{font-size:10px;color:var(--text-dim);display:flex;gap:8px}
.stat-note{color:var(--green)}
.stat-total{color:var(--text-muted)}

/* ── EPISODE LIST (under card) ── */
.ep-container{display:none;border-top:1px solid var(--border)}
.ep-container.open{display:block}

/* Month group */
.month-group{}
.month-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;cursor:pointer;background:var(--surface2);border-bottom:1px solid var(--border);user-select:none}
.month-header:hover{background:#252840}
.month-label{font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px}
.month-chevron{font-size:10px;color:var(--text-muted);transition:transform .15s}
.month-chevron.open{transform:rotate(180deg)}
.month-eps{display:none}
.month-eps.open{display:block}

/* Episode row */
.ep-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.ep-row:last-child{border-bottom:none}
.ep-row:hover{background:var(--surface2)}
.ep-row.read{background:var(--read-bg)}
.ep-row.read .ep-title{color:#6fa66f}
.ep-thumb{width:54px;height:30px;border-radius:3px;object-fit:cover;flex-shrink:0;background:var(--surface2)}
.ep-thumb.sq{width:30px;height:30px;border-radius:4px}
.ep-info{flex:1;min-width:0}
.ep-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.ep-meta{font-size:10px;color:var(--text-dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700}
.badge-note{background:#1a3a25;color:var(--green)}
.badge-transcript{background:#1a2535;color:#7eb8f7}
.badge-nonote{background:#2a2520;color:var(--yellow)}
.badge-new{background:#1a2a3a;color:var(--blue)}
.read-toggle{font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;flex-shrink:0;transition:all .15s;white-space:nowrap}
.read-toggle:hover{border-color:var(--accent);color:var(--accent)}
.ep-row.read .read-toggle{border-color:#3a5a3a;color:#6fa66f}
.ep-dl-btn{font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;flex-shrink:0;transition:all .15s;white-space:nowrap}
.ep-dl-btn:hover{border-color:var(--blue);color:var(--blue)}
.ep-dl-btn.queued{border-color:#3a4a5a;color:#60a5fa;cursor:default}
.ep-dl-btn.done{border-color:#3a5a3a;color:var(--green);cursor:default}
.ep-note-btn{font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;flex-shrink:0;transition:all .15s;white-space:nowrap}
.ep-note-btn:hover{background:var(--accent);color:#fff}
.ep-note-btn.running{border-color:var(--accent);color:var(--accent);cursor:default;animation:note-btn-pulse 1.2s ease-in-out infinite}
@keyframes note-btn-pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(124,106,247,.4)}50%{opacity:.6;box-shadow:0 0 0 4px rgba(124,106,247,0)}}

/* ── DETAIL PANEL ── */
#detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;backdrop-filter:blur(2px)}
#detail-overlay.open{display:flex;align-items:flex-start;justify-content:flex-end}
#detail-panel{width:min(760px,95vw);height:100vh;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#detail-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-shrink:0}
#detail-title{font-size:15px;font-weight:700;line-height:1.4;flex:1}
#detail-meta{font-size:11px;color:var(--text-dim);margin-top:3px}
#detail-close{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;padding:0 4px;flex-shrink:0}
#detail-close:hover{color:var(--text)}
#detail-view-btns{padding:8px 18px;border-bottom:1px solid var(--border);display:flex;gap:4px;flex-shrink:0}
.dvbtn{padding:4px 10px;border-radius:5px;font-size:11px;background:transparent;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;transition:all .15s}
.dvbtn:hover{background:var(--surface2);color:var(--text)}
.dvbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
#detail-body{flex:1;overflow-y:auto;padding:0}
#detail-body::-webkit-scrollbar{width:5px}
#detail-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#detail-loading{height:2px;background:var(--border);position:relative;overflow:hidden;display:none;flex-shrink:0}
#detail-loading::after{content:'';position:absolute;top:0;left:-40%;width:40%;height:100%;background:var(--accent);animation:slide 1s ease-in-out infinite}
@keyframes slide{to{left:100%}}
#detail-audio{background:var(--surface);border-top:1px solid var(--border);padding:8px 16px;display:none;flex-shrink:0}
#detail-audio.on{display:block}
#aud{width:100%;height:30px}

/* Note content */
.nwrap{max-width:100%;padding:22px 22px 50px}
.md{font-size:14px;line-height:1.8;color:var(--text)}
.md h1{font-size:19px;font-weight:700;margin:24px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.md h2{font-size:15px;font-weight:700;margin:22px 0 9px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.md h3{font-size:13px;font-weight:700;margin:16px 0 6px;color:var(--accent)}
.md h4{font-size:12px;font-weight:600;margin:10px 0 4px;color:var(--text-dim)}
.md p{margin-bottom:10px}
.md ul,.md ol{padding-left:20px;margin-bottom:10px}
.md li{margin-bottom:4px}
.md strong{color:#d4d0ff;font-weight:600}
.md em{color:var(--text-dim)}
.md code{background:var(--surface2);padding:1px 5px;border-radius:3px;font-size:12px;font-family:monospace}
.md pre{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:12px;overflow-x:auto;margin:10px 0}
.md pre code{background:none;padding:0}
.md blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--text-dim);margin:10px 0}
.md table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.md th{background:var(--surface2);padding:7px 11px;text-align:left;font-weight:600;border:1px solid var(--border)}
.md td{padding:6px 11px;border:1px solid var(--border)}
.md tr:hover td{background:var(--surface2)}
.md hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.md img{max-width:100%;border-radius:6px;margin:6px 0}
.md a{color:var(--accent);text-decoration:none}
.md a:hover{text-decoration:underline}
.md mark{background:#fbbf2466;color:var(--text);border-radius:2px;padding:0 2px}
.tldr-card{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:7px;padding:13px 15px;margin-bottom:20px}
.tldr-card h3{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:10px}
.tldr-row{display:flex;gap:8px;margin-bottom:6px;font-size:13px}
.tldr-row:last-child{margin-bottom:0}
.tldr-k{color:var(--text-dim);min-width:100px;flex-shrink:0;font-weight:500}
.sec-grid{display:flex;flex-direction:column;gap:8px}
.sec-card{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:11px 14px}
.sec-card h4{font-size:13px;font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.ts-chip{font-size:10px;color:var(--accent);background:var(--accent-dim);padding:1px 5px;border-radius:3px;cursor:pointer}
.ts-chip:hover{filter:brightness(1.3)}
.sec-card ul{padding-left:15px}
.sec-card li{font-size:13px;line-height:1.6;margin-bottom:2px}
.insight-item{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--yellow);border-radius:6px;padding:8px 12px;font-size:13px;line-height:1.6;margin-bottom:7px}

/* Transcript panel */
#tp-panel{display:none;flex-direction:column;border-left:1px solid var(--border);width:280px;min-width:160px;max-width:60vw;flex-shrink:0;overflow:hidden;position:relative}
#tp-panel.open{display:flex}
#tp-head{padding:9px 12px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text-dim);flex-shrink:0}
#tp-list{flex:1;overflow-y:auto}
#tp-list::-webkit-scrollbar{width:3px}
#tp-list::-webkit-scrollbar-thumb{background:var(--border)}
.seg{display:flex;gap:6px;padding:5px 11px;cursor:pointer;transition:background .1s}
.seg:hover{background:var(--surface2)}
.seg.active{background:var(--accent-dim)}
.seg-t{font-size:10px;color:var(--accent);min-width:32px;flex-shrink:0;padding-top:2px}
.seg-txt{font-size:11px;line-height:1.55}
#detail-inner{flex:1;display:flex;overflow:hidden}

/* Resize handles */
#panel-resize{position:absolute;left:0;top:0;width:4px;height:100%;cursor:ew-resize;z-index:10;background:transparent;transition:background .15s}
#panel-resize:hover,#panel-resize.dragging{background:var(--accent)}
#tp-resize{position:absolute;left:0;top:0;width:4px;height:100%;cursor:ew-resize;z-index:10;background:transparent;transition:background .15s}
#tp-resize:hover,#tp-resize.dragging{background:var(--accent)}

/* Fullscreen */
#detail-panel.fullscreen{width:100vw!important}
#detail-expand{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:15px;padding:0 4px;flex-shrink:0;transition:color .15s}
#detail-expand:hover{color:var(--text)}

/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:10px;color:var(--text-muted)}
.empty p{font-size:14px}

/* Download job toast */
#job-toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:12px;z-index:500;min-width:240px;display:none}
#job-toast.show{display:block}
#job-toast .jt-title{font-weight:700;margin-bottom:4px}
#job-toast .jt-phase{color:var(--text-dim)}
#job-toast .jt-bar-wrap{height:3px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
#job-toast .jt-bar{height:100%;background:var(--accent);transition:width .3s}

/* Responsive */
@media(max-width:600px){
  .cards-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  #detail-panel{width:100vw}
}

/* ── Add-channel bar ── */
.page-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.add-ch-btn{padding:6px 14px;border-radius:6px;background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.add-ch-btn:hover{background:var(--accent);color:#fff}
.ch-remove-btn{padding:4px 6px;border-radius:4px;border:1px solid transparent;background:transparent;color:var(--text-muted);cursor:pointer;transition:all .15s;flex-shrink:0;display:flex;align-items:center}
.ch-remove-btn:hover{border-color:var(--red);color:var(--red)}
.card-remove{position:absolute;top:6px;right:6px;z-index:2;background:rgba(15,17,23,.78);border-color:var(--border)}

/* ── Add-channel modal ── */
#add-ch-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;backdrop-filter:blur(3px);align-items:flex-start;justify-content:center;padding-top:80px}
#add-ch-modal.open{display:flex}
#add-ch-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:min(540px,95vw);max-height:70vh;display:flex;flex-direction:column;overflow:hidden}
#add-ch-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
#add-ch-head h2{font-size:14px;font-weight:700}
#add-ch-head button{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;padding:0 4px}
#add-ch-head button:hover{color:var(--text)}
#add-ch-search-wrap{padding:12px 16px;border-bottom:1px solid var(--border);position:relative}
#add-ch-search-wrap svg{position:absolute;left:25px;top:50%;transform:translateY(-50%);opacity:.4;pointer-events:none}
#add-ch-q{width:100%;padding:8px 10px 8px 34px;border-radius:7px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:13px;outline:none}
#add-ch-q:focus{border-color:var(--accent)}
#add-ch-q::placeholder{color:var(--text-muted)}
#add-ch-results{flex:1;overflow-y:auto;padding:8px 0}
#add-ch-results::-webkit-scrollbar{width:4px}
#add-ch-results::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.ach-item{display:flex;align-items:center;gap:12px;padding:9px 16px;cursor:pointer;transition:background .1s}
.ach-item:hover{background:var(--surface2)}
.ach-thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;background:var(--surface2);flex-shrink:0}
.ach-thumb.round{border-radius:50%}
.ach-info{flex:1;min-width:0}
.ach-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ach-sub{font-size:11px;color:var(--text-dim);margin-top:2px}
.ach-add{font-size:11px;padding:4px 10px;border-radius:5px;border:1px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.ach-add:hover{background:var(--accent);color:#fff}
.ach-add:disabled{opacity:.5;cursor:default}
#add-ch-hint{padding:20px;text-align:center;color:var(--text-muted);font-size:13px}

/* ── Inbox ── */
.inbox-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;transition:all .15s}
.inbox-item:hover{border-color:var(--accent)}
.inbox-thumb{width:48px;height:48px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--surface2)}
.inbox-thumb.round{border-radius:50%}
.inbox-info{flex:1;min-width:0}
.inbox-title{font-size:13px;font-weight:600;line-height:1.4;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.inbox-title:hover{color:var(--accent)}
.inbox-meta{font-size:11px;color:var(--text-dim);display:flex;gap:6px;align-items:center}
.inbox-type{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;background:var(--accent-dim);color:var(--accent)}
.inbox-read-btn{font-size:11px;padding:4px 12px;border-radius:5px;border:1px solid var(--green);color:var(--green);background:transparent;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.inbox-read-btn:hover{background:var(--green);color:#000}
.inbox-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;gap:8px;color:var(--text-muted)}
.inbox-empty p{font-size:14px}

/* ── Highlight mode ── */
#hl-mode-btn.active{background:var(--yellow)!important;border-color:var(--yellow)!important;color:#000!important}
body.hl-mode #detail-body{cursor:crosshair}
body.hl-mode #detail-body *{cursor:crosshair;user-select:text}
body.hl-mode #detail-body mark{cursor:pointer}
body.hl-mode #detail-body mark:hover{background:#fbbf2499;outline:2px solid #fbbf24;outline-offset:1px}
</style>
</head>
<body>

<div id="nav">
  <h1>🎙 Notes</h1>
  <button class="nav-tab nav-tab-yt active" data-page="youtube">YouTube</button>
  <button class="nav-tab" data-page="podcast">Podcast</button>
  <button class="nav-tab" data-page="inbox">
    待讀
    <span id="inbox-badge" style="display:none;background:var(--accent);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:4px;vertical-align:middle"></span>
  </button>
  <div id="nav-search">
    <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="11" cy="11" r="8" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="search-input" type="text" placeholder="搜尋…" autocomplete="off">
  </div>
</div>

<!-- Podcast page -->
<div id="page-podcast" class="page">
  <div class="page-toolbar">
    <button class="add-ch-btn" onclick="openAddChannel('podcast')">+ 新增 Podcast</button>
  </div>
  <div id="podcast-cards" class="cards-grid"></div>
</div>

<!-- YouTube page -->
<div id="page-youtube" class="page active">
  <div class="page-toolbar">
    <button class="add-ch-btn" onclick="openAddChannel('yt')">+ 新增 YouTube 頻道</button>
  </div>
  <div id="yt-cards" class="cards-grid"></div>
</div>

<!-- Inbox page -->
<div id="page-inbox" class="page">
  <div class="page-toolbar" style="justify-content:space-between">
    <span style="font-size:13px;font-weight:700;color:var(--text-dim)">待閱讀筆記</span>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="dvbtn inbox-sort-btn active" data-sort="pub_date" title="依發布日期排序">📅 發布</button>
      <button class="dvbtn inbox-sort-btn" data-sort="note_created" title="依筆記建立時間排序">✏️ 筆記</button>
      <button id="inbox-clear-all" class="add-ch-btn" style="background:transparent;border-color:var(--border);color:var(--text-muted);margin-left:6px">全部清除</button>
    </div>
  </div>
  <div id="inbox-list"></div>
</div>

<!-- Add channel modal -->
<div id="add-ch-modal">
  <div id="add-ch-box">

</div>

<script>
const $=id=>document.getElementById(id);
// ── State ─────────────────────────────────────────────────────
let podcasts=[], ytChannels=[], readStatus={}, currentView='note';
let currentItem=null, currentType=null; // 'podcast' | 'yt'
let jobPoll=null;
let ytRefreshPoll=null;
let ytJobRefreshPoll=null;
let inboxItems=[];
let inboxSort='pub_date'; // 'pub_date' | 'note_created'
const analyzingIds=new Set(); // episodeId or 'yt:videoId' currently running
const expandedCards=new Set();
const expandedMonths=new Set(); // key: "cardId:monthKey"

// ── Helpers ───────────────────────────────────────────────────
function avatarPlaceholder(name){
  const initials=(name||'?').replace(/[^a-zA-Z一-鿿]/g,' ').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
  const hue=Math.abs([...name].reduce((a,c)=>a+c.charCodeAt(0),0))%360;
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><rect width='80' height='80' fill='hsl(${hue},35%,25%)'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='28' font-weight='700' fill='hsl(${hue},60%,75%)'>${initials}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
const h=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function ytImg(url){
  if(!url) return '';
  if(url.startsWith('https://yt3.') || url.startsWith('https://i.ytimg.') || url.startsWith('https://img.youtube.'))
    return '/api/proxy-image?url='+encodeURIComponent(url);
  return url;
}
function setImgSrc(el, primary, fallback){
  el.onerror=()=>{ el.onerror=null; el.src=fallback; };
  el.src=primary||fallback;
}
async function api(path,opts){
  const r=await fetch(path,opts);
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
function monthKey(dateStr){
  if(!dateStr) return '未知日期';
  return dateStr.slice(0,7); // "YYYY-MM"
}
function monthLabel(key){
  if(key==='未知日期') return '未知日期';
  const[y,m]=key.split('-');
  return `${y} 年 ${parseInt(m)} 月`;
}
function groupByMonth(items, dateField='upload_date'){
  const groups={};
  for(const it of items){
    const k=monthKey(it[dateField]||'');
    (groups[k]||(groups[k]=[])).push(it);
  }
  // sort months desc
  return Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0]));
}

// ── Inbox ─────────────────────────────────────────────────────
// sort button listeners
document.querySelectorAll('.inbox-sort-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    inboxSort=btn.dataset.sort;
    document.querySelectorAll('.inbox-sort-btn').forEach(b=>b.classList.toggle('active',b.dataset.sort===inboxSort));
    renderInbox();
  });
});

function updateInboxBadge(){
  const badge=$('inbox-badge');
  if(inboxItems.length){
    badge.textContent=inboxItems.length;
    badge.style.display='inline';
  }else{
    badge.style.display='none';
  }
}

function renderInbox(){
  updateInboxBadge();
  const el=$('inbox-list');
  if(!el) return;
  if(!inboxItems.length){
    el.innerHTML='<div class="inbox-empty"><p>沒有待閱讀的筆記</p></div>';
    return;
  }
  const sorted=[...inboxItems].sort((a,b)=>{
    const va=inboxSort==='note_created'?(a.note_created||0):(a.pub_date||'');
    const vb=inboxSort==='note_created'?(b.note_created||0):(b.pub_date||'');
    return va>vb?-1:va<vb?1:0;
  });
  el.innerHTML='';
  for(const item of sorted){
    const isYT=item.type==='yt';
    const thumb=isYT
      ? ytImg(item.thumbnail||`https://img.youtube.com/vi/${item.video_id}/mqdefault.jpg`)
      : (item.artwork||'');
    const typeLabel=isYT?'YouTube':'Podcast';
    const meta=[isYT?item.channel:item.podcast, item.episode, item.date].filter(Boolean).join(' · ');

    const row=document.createElement('div');
    row.className='inbox-item';
    row.innerHTML=`
      <img class="inbox-thumb${isYT?'':' round'}" src="${h(thumb)}" onerror="this.style.opacity='.3'">
      <div class="inbox-info">
        <div class="inbox-title" data-id="${h(item.id)}">${h(item.title||item.episode||item.video_id||'')}</div>
        <div class="inbox-meta">
          <span class="inbox-type">${typeLabel}</span>
          <span>${h(meta)}</span>
        </div>
        <div class="inbox-meta" style="margin-top:3px;gap:10px">
          ${item.pub_date?`<span title="發布日期">📅 ${h(item.pub_date)}</span>`:''}
          ${item.note_created?`<span title="筆記建立時間">✏️ ${new Date(item.note_created*1000).toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'})}</span>`:''}
        </div>
      </div>
      <button class="inbox-read-btn" data-id="${h(item.id)}">✓ 已閱</button>`;

    // 點標題 → 開 detail
    row.querySelector('.inbox-title').addEventListener('click',()=>{
      if(isYT){
        const v={id:item.video_id, title_zh:item.title, title:item.title, channel:item.channel,
                 url:item.url, thumbnail:item.thumbnail, has_note:!!item.note_path,
                 has_analysis:!!item.note_path, has_transcript:true};
        openDetailYT(v);
      }else{
        const pod=podcasts.find(p=>p.id===item.podcast_id)||{name:item.podcast};
        const ep={id:`${item.podcast_id}_${item.episode}`, title_zh:item.title,
                  episode_label:item.episode, has_note:!!item.note_path,
                  has_transcript:true, _pod:pod.name};
        openDetail('podcast', ep, pod);
      }
    });

    // 已閱 → dismiss
    row.querySelector('.inbox-read-btn').addEventListener('click',async e=>{
      e.stopPropagation();
      const id=e.target.dataset.id;
      try{
        await api(`/api/inbox/${encodeURIComponent(id)}/dismiss`,{method:'POST'});
        inboxItems=inboxItems.filter(i=>i.id!==id);
        renderInbox();
      }catch(err){ alert('失敗：'+err.message); }
    });

    el.appendChild(row);
  }
}

$('inbox-clear-all')?.addEventListener('click',async()=>{
  if(!inboxItems.length) return;
  if(!confirm(`清除全部 ${inboxItems.length} 筆待閱讀？`)) return;
  try{
    await api('/api/inbox/dismiss-all',{method:'POST'});
    inboxItems=[];
    renderInbox();
  }catch(err){ alert('失敗：'+err.message); }
});

// ── Init ──────────────────────────────────────────────────────
async function init(){
  const[pods,rs,inbox]=await Promise.all([
    api('/api/podcasts').catch(()=>[]),
    api('/api/reading-status').catch(()=>({})),
    api('/api/inbox').catch(()=>[]),
  ]);
  podcasts=pods; readStatus=rs; inboxItems=inbox;
  renderPodcastCards();
  renderInbox();

  api('/api/youtube/channels').then(chs=>{
    ytChannels=chs;
    renderYTCards();
    startYTPollIfNeeded();
    startYTJobRefreshPoll();
    // 若有缺 avatar，觸發補抓
    const missingAvatar=chs.filter(c=>c.handle&&!c.avatar);
    if(missingAvatar.length){
      api('/api/youtube/channels/refresh-avatars',{method:'POST'}).catch(()=>{});
      setTimeout(()=>{
        api('/api/youtube/channels').then(updated=>{ytChannels=updated;renderYTCards();}).catch(()=>{});
      }, 8000);
    }
  }).catch(()=>{});

  // Podcast 同樣：若 remote 未就緒，15 秒後重抓
  setTimeout(()=>{
    if(podcasts.some(p=>!p.remote_ready)){
      api('/api/podcasts').then(updated=>{podcasts=updated;renderPodcastCards();}).catch(()=>{});
    }
  }, 15000);
}

function startYTPollIfNeeded(){
  if(!ytChannels.some(c=>c.handle&&(!c.remote_ready||c.remote_loading||!c.dates_ready))){
    if(ytRefreshPoll){clearInterval(ytRefreshPoll);ytRefreshPoll=null;}
    return;
  }
  if(ytRefreshPoll) return;
  let attempts=0;
  ytRefreshPoll=setInterval(()=>{
    attempts++;
    api('/api/youtube/channels').then(updated=>{
      ytChannels=updated;
      renderYTCards();
      if(!updated.some(c=>c.handle&&(!c.remote_ready||c.remote_loading||!c.dates_ready))||attempts>=120){
        clearInterval(ytRefreshPoll);
        ytRefreshPoll=null;
      }
    }).catch(()=>{});
  },5000);
}

function startYTJobRefreshPoll(){
  if(ytJobRefreshPoll) return;
  ytJobRefreshPoll=setInterval(async()=>{
    try{
      const jobs=await api('/api/jobs');
      const now=Date.now()/1000;
      const needsRefresh=jobs.some(j=>{
        const isYT=String(j.type||'').startsWith('yt_');
        const active=j.status==='pending'||j.status==='running';
        const recent=(now-(j.finished_at||j.started_at||0))<20;
        return isYT&&(active||recent);
      });
      if(needsRefresh){
        const updated=await api('/api/youtube/channels');
        ytChannels=updated;
        renderYTCards();
      }
    }catch(_){}
  },5000);
}

// ── Nav tabs ──────────────────────────────────────────────────
document.querySelectorAll('.nav-tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    $(`page-${btn.dataset.page}`).classList.add('active');
  });
});
$('search-input').addEventListener('input',()=>{
  renderPodcastCards(); renderYTCards();
});

// ── PODCAST CARDS ─────────────────────────────────────────────
function renderPodcastCards(){
  const q=$('search-input').value.trim().toLowerCase();
  const container=$('podcast-cards');
  container.innerHTML='';

  for(const pod of podcasts){
    const allEps=pod.episodes||[];
    const filtered=q
      ? allEps.filter(e=>(e.title_zh||'').toLowerCase().includes(q)||(e.episode_label||'').toLowerCase().includes(q))
      : allEps;

    const wrap=document.createElement('div');
    wrap.style.gridColumn=expandedCards.has(pod.id)?'1 / -1':'';

    const card=document.createElement('div');
    card.className='source-card'+(expandedCards.has(pod.id)?' expanded':'');
    card.dataset.id=pod.id;

    const noteCount=allEps.filter(e=>e.has_note).length;

    if(expandedCards.has(pod.id)){
      // expanded layout: horizontal header + episode list
      card.innerHTML=`
        <div style="display:flex;align-items:center;gap:14px;padding:12px 14px;cursor:pointer" data-toggle="${pod.id}">
          <img src="${h(pod.artwork)}" style="width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0" onerror="this.style.display='none'">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700">${h(pod.name)}</div>
            <div style="font-size:11px;color:var(--text-dim);margin-top:2px">
              <span class="stat-note">${noteCount} 篇筆記</span>
              <span style="margin:0 4px;color:var(--text-muted)">·</span>
              <span class="stat-total">${allEps.length} 集</span>
            </div>
          </div>
          <button class="ch-remove-btn" data-id="${h(pod.id)}" title="移除頻道"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
          <span style="font-size:18px;color:var(--text-muted)">⌃</span>
        </div>`;
      const epContainer=buildPodEpList(pod, filtered);
      card.appendChild(epContainer);
    } else {
      card.innerHTML=`
        <button class="ch-remove-btn card-remove" data-id="${h(pod.id)}" title="移除頻道"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
        <img class="card-art" src="${h(pod.artwork)}" alt="" onerror="this.style.display='none'">
        <div class="card-body">
          <div class="card-name">${h(pod.name)}</div>
          <div class="card-stats">
            <span class="stat-note">${noteCount} 篇筆記</span>
            <span class="stat-total">${allEps.length} 集</span>
          </div>
        </div>`;
    }

    card.addEventListener('click',e=>{
      if(e.target.closest('.ch-remove-btn')){
        const id=e.target.closest('.ch-remove-btn').dataset.id;
        removePodcast(id); return;
      }
      if(e.target.closest('[data-toggle]')){
        expandedCards.delete(pod.id);
        renderPodcastCards(); return;
      }
      if(e.target.closest('.ep-row')||e.target.closest('.month-header')||
         e.target.closest('.read-toggle')||e.target.closest('.ep-dl-btn')||e.target.closest('.ep-note-btn')) return;
      if(!expandedCards.has(pod.id)){
        expandedCards.add(pod.id);
        renderPodcastCards();
      }
    });

    wrap.appendChild(card);
    container.appendChild(wrap);
  }
}

function buildPodEpList(pod, episodes){
  const container=document.createElement('div');
  container.className='ep-container open';

  const months=groupByMonth(episodes,'upload_date');
  months.forEach(([mk, eps], idx)=>{
    const mkey=`${pod.id}:${mk}`;
    const isOpen=idx===0 || expandedMonths.has(mkey); // first month open by default

    const group=document.createElement('div');
    group.className='month-group';

    const mhead=document.createElement('div');
    mhead.className='month-header';
    mhead.innerHTML=`<span class="month-label">${monthLabel(mk)}</span><span class="month-chevron${isOpen?' open':''}">▼</span>`;
    mhead.addEventListener('click',e=>{
      e.stopPropagation();
      const meps=group.querySelector('.month-eps');
      const chev=mhead.querySelector('.month-chevron');
      const nowOpen=meps.classList.toggle('open');
      chev.classList.toggle('open',nowOpen);
      if(nowOpen) expandedMonths.add(mkey); else expandedMonths.delete(mkey);
    });

    const meps=document.createElement('div');
    meps.className='month-eps'+(isOpen?' open':'');

    for(const ep of eps){
      meps.appendChild(buildPodEpRow(ep, pod));
    }

    group.appendChild(mhead);
    group.appendChild(meps);
    container.appendChild(group);
  });

  return container;
}

function buildPodEpRow(ep, pod){
  const epNum=ep.ep_num||'';
  const rs=readStatus[epNum]||'unread';
  const isLocal=ep.is_local||ep.has_audio||ep.has_transcript||ep.has_note;
  const row=document.createElement('div');
  row.className='ep-row'+(rs==='read'?' read':'')+(isLocal?'':' no-note');
  row.dataset.epid=ep.id;

  const dlLabel=isLocal?'↓ 再下載':'↓ 下載';
  const dlClass=isLocal?'ep-dl-btn done':'ep-dl-btn';

  const showNoteBtn = ep.has_transcript && !ep.has_note;
  const isAnalyzing = analyzingIds.has(ep.id);
  row.innerHTML=`
    <img class="ep-thumb sq" src="${h(ep._artwork||ep.artwork||pod.artwork)}" onerror="this.style.display='none'">
    <div class="ep-info">
      <div class="ep-title">${h(ep.title_zh||ep.episode_label||ep.id)}</div>
      <div class="ep-meta">
        ${ep.episode_label?`<span>${h(ep.episode_label)}</span>`:''}
        ${ep.upload_date?`<span>${h(ep.upload_date)}</span>`:''}
        ${ep.duration?`<span>${h(ep.duration)}</span>`:''}
        ${ep.has_note?`<span class="badge badge-note">筆記</span>`:''}
        ${ep.has_transcript&&!ep.has_note?`<span class="badge badge-transcript">逐字稿</span>`:''}
        ${!isLocal?`<span class="badge badge-new">未下載</span>`:''}
      </div>
    </div>
    ${isLocal||!epNum?`<button class="read-toggle" data-epnum="${h(epNum)}">${rs==='read'?'已讀':'未讀'}</button>`:''}
    ${showNoteBtn||isAnalyzing?`<button class="ep-note-btn${isAnalyzing?' running':''}" data-epid="${h(ep.id)}" data-title="${h(ep.title_zh||ep.episode_label||'')}"${isAnalyzing?' disabled':''}>
      ${isAnalyzing?'⏳ 產生中…':'✨ 產生筆記'}</button>`:''}
    <button class="${dlClass}" data-podid="${h(pod.id)}" data-epnum="${h(epNum)}" data-title="${h(ep.title_zh||ep.episode_label||'')}">${dlLabel}</button>`;

  row.querySelector('.read-toggle')?.addEventListener('click',e=>{
    e.stopPropagation();
    toggleRead(epNum, row, e.target);
  });
  row.querySelector('.ep-note-btn')?.addEventListener('click',e=>{
    e.stopPropagation();
    startAnalyze(ep.id, ep.title_zh||ep.episode_label||ep.id, e.target);
  });
  row.querySelector('.ep-dl-btn').addEventListener('click',e=>{
    e.stopPropagation();
    startDownload(pod.id, epNum||'latest', ep.title_zh||ep.episode_label||epNum, e.target);
  });
  row.addEventListener('click',()=>{
    if(ep.has_note) openDetail('podcast', ep, pod);
  });
  return row;
}

// ── YOUTUBE CARDS ─────────────────────────────────────────────
function renderYTCards(){
  const q=$('search-input').value.trim().toLowerCase();
  const container=$('yt-cards');
  container.innerHTML='';

  for(const ch of ytChannels){
    const allVids=ch.videos||[];
    const filtered=q
      ? allVids.filter(v=>(v.title_zh||v.title||'').toLowerCase().includes(q))
      : allVids;

    const wrap=document.createElement('div');
    wrap.style.gridColumn=expandedCards.has('yt:'+ch.handle)?'1 / -1':'';

    const card=document.createElement('div');
    card.className='source-card'+(expandedCards.has('yt:'+ch.handle)?' expanded':'');

    if(expandedCards.has('yt:'+ch.handle)){
      card.innerHTML=`
        <div style="display:flex;align-items:center;gap:14px;padding:12px 14px;cursor:pointer" data-toggle="yt:${h(ch.handle)}">
          <img class="yt-avatar-img" style="width:48px;height:48px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--surface2)">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700">${h(ch.name)}</div>
            <div style="font-size:11px;color:var(--text-dim);margin-top:2px">
              <span class="stat-note">${ch.note_count} 篇筆記</span>
              <span style="margin:0 4px;color:var(--text-muted)">·</span>
              <span class="stat-total">${ch.video_count} 支影片</span>
            </div>
          </div>
          <button class="ch-remove-btn" data-handle="${h(ch.handle)}" title="移除頻道"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
          <span style="font-size:18px;color:var(--text-muted)">⌃</span>
        </div>`;
      setImgSrc(card.querySelector('.yt-avatar-img'), ytImg(ch.avatar), avatarPlaceholder(ch.name||ch.handle));
      const epContainer=buildYTEpList(ch, filtered);
      card.appendChild(epContainer);
    } else {
      card.innerHTML=`

          <div class="card-stats">
            <span class="stat-note">${ch.note_count} 篇筆記</span>
            <span class="stat-total">${ch.video_count} 支</span>
          </div>
        </div>`;
      setImgSrc(card.querySelector('.yt-avatar-img'), ytImg(ch.avatar), avatarPlaceholder(ch.name||ch.handle));
    }

    card.addEventListener('click',e=>{
      if(e.target.closest('.ch-remove-btn')){
        const handle=e.target.closest('.ch-remove-btn').dataset.handle;
        removeYTChannel(handle); return;
      }
      if(e.target.closest('[data-toggle]')){
        expandedCards.delete('yt:'+ch.handle);
        renderYTCards(); return;
      }
      if(e.target.closest('.ep-row')||e.target.closest('.month-header')||
         e.target.closest('.read-toggle')||e.target.closest('.ep-dl-btn')||e.target.closest('.ep-note-btn')) return;
      if(!expandedCards.has('yt:'+ch.handle)){
        expandedCards.add('yt:'+ch.handle);
        renderYTCards();
      }
    });

    wrap.appendChild(card);
    container.appendChild(wrap);
  }
}

function buildYTEpList(ch, videos){
  const container=document.createElement('div');
  container.className='ep-container open';

  const months=groupByMonth(videos,'upload_date');
  months.forEach(([mk,vids],idx)=>{
    const mkey=`yt:${ch.handle}:${mk}`;
    const isOpen=idx===0||expandedMonths.has(mkey);

    const group=document.createElement('div');
    group.className='month-group';

    const mhead=document.createElement('div');
    mhead.className='month-header';
    mhead.innerHTML=`<span class="month-label">${monthLabel(mk)}</span><span class="month-chevron${isOpen?' open':''}">▼</span>`;
    mhead.addEventListener('click',e=>{
      e.stopPropagation();
      const meps=group.querySelector('.month-eps');
      const chev=mhead.querySelector('.month-chevron');
      const nowOpen=meps.classList.toggle('open');
      chev.classList.toggle('open',nowOpen);
      if(nowOpen) expandedMonths.add(mkey); else expandedMonths.delete(mkey);
    });

    const meps=document.createElement('div');
    meps.className='month-eps'+(isOpen?' open':'');

    for(const v of vids){
      meps.appendChild(buildYTRow(v));
    }

    group.appendChild(mhead);
    group.appendChild(meps);
    container.appendChild(group);
  });

  return container;
}

function buildYTRow(v){
  const rs=readStatus[v.id]||'unread';
  const isLocal=v.is_local||v.has_local||v.has_analysis||v.has_note;
  const hasDone=v.has_analysis||v.has_transcript;
  const actionText=v.has_note?'✓ 有筆記':(v.has_transcript?'✓ 逐字稿':'↓ 處理');
  const showNoteBtn=v.has_transcript&&!v.has_note;
  const isAnalyzing=analyzingIds.has('yt:'+v.id);
  const row=document.createElement('div');
  row.className='ep-row'+(rs==='read'?' read':'')+(isLocal?'':' no-note');

  row.innerHTML=`
    <img class="ep-thumb yt-thumb-img">
    <div class="ep-info">
      <div class="ep-title">${h(v.title_zh||v.title||v.id)}</div>
      <div class="ep-meta">
        ${v.upload_date?`<span>${h(v.upload_date)}</span>`:''}
        ${v.duration?`<span>${h(v.duration)}</span>`:''}
        ${v.has_note?`<span class="badge badge-note">筆記</span>`:''}
        ${v.has_transcript&&!v.has_note?`<span class="badge badge-transcript">逐字稿</span>`:''}
        ${!isLocal?`<span class="badge badge-new">未處理</span>`:''}
      </div>
    </div>
    <button class="read-toggle" data-vid="${h(v.id)}">${rs==='read'?'已讀':'未讀'}</button>
    ${showNoteBtn||isAnalyzing?`<button class="ep-note-btn${isAnalyzing?' running':''}" data-vid="${h(v.id)}" data-title="${h(v.title_zh||v.title||'')}"${isAnalyzing?' disabled':''}>
      ${isAnalyzing?'⏳ 產生中…':'✨ 產生筆記'}</button>`:''}
    <button class="ep-dl-btn${hasDone?' done':''}" data-vid="${h(v.id)}" data-url="${h(v.url)}">
      ${actionText}
    </button>`;

  setImgSrc(row.querySelector('.yt-thumb-img'), ytImg(v.thumbnail), '');

  row.querySelector('.read-toggle').addEventListener('click',e=>{
    e.stopPropagation();
    toggleReadYT(v.id, row, e.target);
  });
  row.querySelector('.ep-note-btn')?.addEventListener('click',e=>{
    e.stopPropagation();
    startAnalyzeYT(v.id, v.title_zh||v.title||v.id, e.target);
  });
  row.querySelector('.ep-dl-btn').addEventListener('click',e=>{
    e.stopPropagation();
    if(!hasDone) addToYTQueue(v.url, e.target);
  });
  row.addEventListener('click',()=>{
    if(v.has_note||v.has_analysis||v.has_transcript) openDetailYT(v);
  });
  return row;
}

async function dismissInboxByEp(epNum, videoId){
  // find matching inbox item and dismiss it
  const item=inboxItems.find(i=>
    (epNum && i.episode && i.episode.replace('EP','')===String(epNum)) ||
    (videoId && i.video_id===videoId)
  );
  if(!item) return;
  try{
    await api(`/api/inbox/${encodeURIComponent(item.id)}/dismiss`,{method:'POST'});
    inboxItems=inboxItems.filter(i=>i.id!==item.id);
    renderInbox();
  }catch(_){}
}

async function toggleRead(epNum, row, btn){
  if(!epNum) return;
  const isRead=row.classList.contains('read');
  const endpoint=isRead?'unread':'read';
  try{
    await api(`/api/reading-status/${epNum}/${endpoint}`,{method:'POST'});
    readStatus[epNum]=isRead?'unread':'read';
    row.classList.toggle('read',!isRead);
    btn.textContent=isRead?'未讀':'已讀';
    if(!isRead) dismissInboxByEp(epNum, null);
  }catch(e){ alert('標記失敗：'+e.message); }
}

async function toggleReadYT(videoId, row, btn){
  const isRead=row.classList.contains('read');
  row.classList.toggle('read',!isRead);
  btn.textContent=isRead?'未讀':'已讀';
  readStatus[videoId]=isRead?'unread':'read';
  if(!isRead) dismissInboxByEp(null, videoId);
}

function showJobToast(jobId, title){
  $('jt-title').textContent=title||'下載中';
  $('jt-phase').textContent='準備中';
  $('jt-bar').style.width='0%';
  $('job-toast').classList.add('show');

  if(jobPoll) clearInterval(jobPoll);
  jobPoll=setInterval(async()=>{
    try{
      const job=await api(`/api/jobs/${jobId}`);
      $('jt-phase').textContent=job.phase||job.status;
      $('jt-bar').style.width=(job.progress||0)+'%';
      if(job.status==='done'||job.status==='error'){
        clearInterval(jobPoll); jobPoll=null;
        api('/api/youtube/channels').then(updated=>{ytChannels=updated;renderYTCards();}).catch(()=>{});
        if(job.status==='done'){
          api('/api/inbox').then(items=>{inboxItems=items;renderInbox();}).catch(()=>{});
        }
        setTimeout(()=>$('job-toast').classList.remove('show'),3000);
      }
    }catch(_){ clearInterval(jobPoll); jobPoll=null; }
  },1000);
}

// ── Note view: raw MD → marked ────────────────────────────────
function _mdToHtml(markdown){
  const body=markdown.replace(/^---\n[\s\S]*?\n---\n/,'');
  // stash ==highlights== as placeholders before marked touches them
  const marks=[];
  const withPlaceholders=body.replace(/==([^=\n]+?)==/g,(_,t)=>{
    marks.push(t);
    return `\x00MARK${marks.length-1}\x00`;
  });
  const clean=withPlaceholders
    .replace(/!\[\[([^\]]+)\]\]/g,'**[嵌入: $1]**')
    .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,'[$2](#)')
    .replace(/\[\[([^\]]+)\]\]/g,'$1');
  const html=marked.parse(clean)
    .replace(/\x00MARK(\d+)\x00/g,(_,i)=>`<mark>${marks[+i]}</mark>`)
    // fallback: maxresdefault → mqdefault for YT thumbnails in note body
    .replace(/(<img\s[^>]*src="[^"]*youtube\.com\/vi\/[^"]*\/)maxresdefault(\.jpg")/g,'$1mqdefault$2');
  return `<div class="nwrap"><div class="md">${html}</div></div>`;
}

async function renderDetailNote(){
  const item=currentItem;
  if(!item) return;

  // podcast: always try note-raw → marked
  if(currentType==='podcast' && item.id){
    try{
      const{markdown}=await api(`/api/episodes/${item.id}/note-raw`);
      $('detail-body').innerHTML=_mdToHtml(markdown);
      return;
    }catch(_){}
  }

  // YT: try note-raw first (has actual .md with ==highlights==)
  if(currentType==='yt' && item.id){
    try{
      const{markdown}=await api(`/api/youtube/videos/${item.id}/note-raw`);
      $('detail-body').innerHTML=_mdToHtml(markdown);
      return;
    }catch(_){}
  }

  // fallback: render from parsed note data (no highlight support)
  const note=item._note;
  if(!note){ $('detail-body').innerHTML=`<div class="empty"><p>無法取得筆記</p></div>`; return; }
  renderFromParsed(note);
}

function renderFromParsed(n){
  let html=`<div class="nwrap">`;
  if(n.tldr&&Object.keys(n.tldr).length){
    html+=`<div class="tldr-card"><h3>TL;DR</h3>`;
    for(const[k,v]of Object.entries(n.tldr))
      html+=`<div class="tldr-row"><span class="tldr-k">${h(k)}</span><span style="color:var(--text)">${h(v)}</span></div>`;
    html+=`</div>`;
  }
  if(n.sections?.length){
    html+=`<div class="sec-grid" style="margin-bottom:20px">`;
    for(const s of n.sections){
      const pts=(s.content_points||[]).filter(p=>p.trim());
      html+=`<div class="sec-card"><h4>${h(s.title)}${s.start_time?`<span class="ts-chip" data-ts="${h(s.start_time)}">${h(s.start_time)}</span>`:''}</h4>`;
      if(pts.length) html+=`<ul>${pts.map(p=>`<li>${inline(p.replace(/^[-*]\s*/,''))}</li>`).join('')}</ul>`;
      html+=`</div>`;
    }
    html+=`</div>`;
  }
  if(n.key_insights?.length){
    html+=`<div class="md" style="font-size:14px;font-weight:700;margin:20px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)">關鍵洞見</div>`;
    html+=n.key_insights.map(i=>`<div class="insight-item">${h(i)}</div>`).join('');
  }
  if(n.data_table?.length){
    html+=`<div class="md" style="font-size:14px;font-weight:700;margin:20px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)">關鍵數據速查</div>`;
    html+=`<table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr>
      <th style="background:var(--surface2);padding:6px 10px;border:1px solid var(--border)">指標</th>
      <th style="background:var(--surface2);padding:6px 10px;border:1px solid var(--border)">數值</th>
      <th style="background:var(--surface2);padding:6px 10px;border:1px solid var(--border)">備註</th>
    </tr></thead><tbody>`;
    for(const r of n.data_table)
      html+=`<tr><td style="padding:6px 10px;border:1px solid var(--border)">${h(r['指標']||'')}</td>
        <td style="padding:6px 10px;border:1px solid var(--border)">${h(r['數值']||'')}</td>
        <td style="padding:6px 10px;border:1px solid var(--border)">${h(r['備註']||'')}</td></tr>`;
    html+=`</tbody></table>`;
  }
  html+=`</div>`;
  $('detail-body').innerHTML=html;
  $('detail-body').querySelectorAll('.ts-chip[data-ts]').forEach(el=>{
    el.addEventListener('click',()=>seekAudio(el.dataset.ts));
  });
}

function renderDetailSections(){
  const note=currentItem?._note;
  if(!note){ renderDetailNote(); return; }
  let html=`<div class="nwrap">`;
  if(note.tldr&&Object.keys(note.tldr).length){
    html+=`<div class="tldr-card"><h3>TL;DR</h3>`;
    for(const[k,v]of Object.entries(note.tldr))
      html+=`<div class="tldr-row"><span class="tldr-k">${h(k)}</span><span style="color:var(--text)">${h(v)}</span></div>`;
    html+=`</div>`;
  }
  if(note.sections?.length){
    html+=`<div class="sec-grid">`;
    for(const s of note.sections){
      const pts=(s.content_points||[]).filter(p=>p.trim());
      html+=`<div class="sec-card"><h4>${h(s.title)}${s.start_time?`<span class="ts-chip" data-ts="${h(s.start_time)}">${h(s.start_time)}</span>`:''}</h4>`;
      if(pts.length) html+=`<ul>${pts.map(p=>`<li>${inline(p.replace(/^[-*]\s*/,''))}</li>`).join('')}</ul>`;
      html+=`</div>`;
    }
    html+=`</div>`;
  }else html+=`<div class="empty"><p>此筆記無章節結構</p></div>`;
  html+=`</div>`;
  $('detail-body').innerHTML=html;
  $('detail-body').querySelectorAll('.ts-chip[data-ts]').forEach(el=>{
    el.addEventListener('click',()=>seekAudio(el.dataset.ts));
  });
}


// ── Transcript ────────────────────────────────────────────────
async function toggleTP(){
  const panel=$('tp-panel');
  if(panel.classList.contains('open')){panel.classList.remove('open');return;}
  panel.classList.add('open');
  $('tp-list').innerHTML='<div style="padding:10px;color:var(--text-muted);font-size:12px">載入中…</div>';
  try{
    const path=currentType==='podcast'
      ? `/api/episodes/${currentItem.id}/transcript`
      : `/api/youtube/videos/${currentItem.id}/transcript`;
    const data=await api(path);
    $('tp-list').innerHTML='';
    for(const seg of(data.segments||[])){
      const d=document.createElement('div');
      d.className='seg'; d.dataset.sec=seg.seconds;
      d.innerHTML=`<span class="seg-t">${h(seg.time)}</span><span class="seg-txt">${h(seg.text)}</span>`;
      d.addEventListener('click',()=>seekAudio(seg.time,seg.seconds));
      $('tp-list').appendChild(d);
    }
  }catch(e){
    $('tp-list').innerHTML=`<div style="padding:10px;color:var(--red);font-size:12px">${h(e.message)}</div>`;
  }
}

// ── Audio seek ────────────────────────────────────────────────
function seekAudio(timeStr,seconds){
  const aud=$('aud-bar'),bar=$('detail-audio');
  if(!aud.src||aud.src===location.href){
    if(!currentItem||currentType!=='podcast') return;
    aud.src=`/api/episodes/${currentItem.id}/audio`;
    bar.classList.add('on');
  }
  const s=seconds!==undefined?seconds:ts2s(timeStr);
  aud.currentTime=s; aud.play().catch(()=>{});
  document.querySelectorAll('.seg').forEach(el=>
    el.classList.toggle('active',parseFloat(el.dataset.sec)===parseFloat(s)));
}
function ts2s(t){
  const p=t.split(':').map(Number);
  return p.length===2?p[0]*60+p[1]:p[0]*3600+p[1]*60+p[2];
}

// ── Add-channel modal ─────────────────────────────────────────
let _addChMode='yt', _addChTimer=null;

function openAddChannel(mode){
  _addChMode=mode;
  $('add-ch-title').textContent=mode==='yt'?'新增 YouTube 頻道':'新增 Podcast';
  $('add-ch-q').placeholder=mode==='yt'?'搜尋頻道名稱…':'搜尋 Podcast 名稱…';
  $('add-ch-q').value='';
  $('add-ch-results').innerHTML='<div id="add-ch-hint">輸入關鍵字開始搜尋</div>';
  $('add-ch-modal').classList.add('open');
  setTimeout(()=>$('add-ch-q').focus(),50);
}

function closeAddChannel(){
  $('add-ch-modal').classList.remove('open');
  clearTimeout(_addChTimer);
}

$('add-ch-modal').addEventListener('click',e=>{
  if(e.target===$('add-ch-modal')) closeAddChannel();
});

$('add-ch-q').addEventListener('keydown',e=>{
  if(e.key==='Escape') closeAddChannel();
});

$('add-ch-q').addEventListener('input',()=>{
  clearTimeout(_addChTimer);
  const q=$('add-ch-q').value.trim();
  if(!q){
    $('add-ch-results').innerHTML='<div id="add-ch-hint">輸入關鍵字開始搜尋</div>';
    return;
  }
  $('add-ch-results').innerHTML='<div id="add-ch-hint">搜尋中…</div>';
  _addChTimer=setTimeout(()=>_doAddChSearch(q), 350);
});

async function _doAddChSearch(q){
  const mode=_addChMode;
  try{
    const results=mode==='yt'
      ? await api(`/api/youtube/search-channels?q=${encodeURIComponent(q)}&limit=8`)
      : await api(`/api/search-podcasts?q=${encodeURIComponent(q)}&limit=8`);
    if($('add-ch-q').value.trim()!==q) return; // stale
    _renderAddChResults(results, mode);
  }catch(e){
    $('add-ch-results').innerHTML=`<div id="add-ch-hint" style="color:var(--red)">搜尋失敗：${h(e.message)}</div>`;
  }
}

function _renderAddChResults(results, mode){
  const container=$('add-ch-results');
  if(!results.length){
    container.innerHTML='<div id="add-ch-hint">沒有結果</div>';
    return;
  }
  const existingHandles=new Set(ytChannels.map(c=>c.handle));
  const existingRss=new Set(podcasts.map(p=>p.rss||''));

  container.innerHTML='';
  for(const r of results){
    const item=document.createElement('div');
    item.className='ach-item';
    const thumb=mode==='yt' ? ytImg(r.artwork||r.thumbnail||'') : (r.artwork||r.thumbnail||'');
    const isRound=mode==='yt';
    const alreadyAdded=mode==='yt'
      ? existingHandles.has(r.handle)
      : existingRss.has(r.rss);
    const sub=mode==='yt'
      ? h(r.handle||'')
      : `${h(r.artist||'')}${r.episode_count?` · ${r.episode_count} 集`:''}`;
    item.innerHTML=`
      <img class="ach-thumb${isRound?' round':''}" src="${h(thumb)}" onerror="this.style.visibility='hidden'">
      <div class="ach-info">
        <div class="ach-name">${h(r.name||r.handle||'')}</div>
        <div class="ach-sub">${sub}</div>
      </div>
      <button class="ach-add"${alreadyAdded?' disabled':''}>${alreadyAdded?'已新增':'+ 新增'}</button>`;
    if(!alreadyAdded){
      item.querySelector('.ach-add').addEventListener('click',e=>{
        e.stopPropagation();
        _confirmAddChannel(r, mode, item.querySelector('.ach-add'));
      });
    }
    container.appendChild(item);
  }
}

async function _confirmAddChannel(r, mode, btn){
  btn.disabled=true;
  btn.textContent='新增中…';
  try{
    if(mode==='yt'){
      await api('/api/youtube/channels',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({handle:r.handle, name:r.name, channel_id:r.channel_id||'', avatar:r.thumbnail||''}),
      });
      btn.textContent='✓ 已新增';
      const updated=await api('/api/youtube/channels');
      ytChannels=updated; renderYTCards(); startYTPollIfNeeded();
    }else{
      await api('/api/podcasters',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({rss:r.rss, name:r.name, apple_id:r.apple_id||'', artwork:r.artwork||'', language:'zh', note_type:'investment'}),
      });
      btn.textContent='✓ 已新增';
      const updated=await api('/api/podcasts');
      podcasts=updated; renderPodcastCards();
    }
  }catch(e){
    btn.disabled=false;
    btn.textContent='+ 新增';
    alert('新增失敗：'+e.message);
  }
}

async function removeYTChannel(handle){
  if(!confirm(`移除頻道 ${handle}？（不刪除本地資料）`)) return;
  try{
    await api(`/api/youtube/channels/${encodeURIComponent(handle)}`,{method:'DELETE'});
    expandedCards.delete('yt:'+handle);
    const updated=await api('/api/youtube/channels');
    ytChannels=updated; renderYTCards();
  }catch(e){ alert('移除失敗：'+e.message); }
}

async function removePodcast(podId){
  const pod=podcasts.find(p=>p.id===podId);
  if(!confirm(`移除 ${pod?.name||podId}？（不刪除本地資料）`)) return;
  try{
    await api(`/api/podcasters/${encodeURIComponent(podId)}`,{method:'DELETE'});
    expandedCards.delete(podId);
    const updated=await api('/api/podcasts');
    podcasts=updated; renderPodcastCards();
  }catch(e){ alert('移除失敗：'+e.message); }
}

// ── Inline markdown ───────────────────────────────────────────
function inline(s){
  return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
          .replace(/\*(.+?)\*/g,'<em>$1</em>')
          .replace(/`(.+?)`/g,'<code>$1</code>')
          .replace(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g,'<span style="color:var(--accent)">$1</span>');
}
function detailLoading(on){$('detail-loading').style.display=on?'block':'none'}


// ── Highlight mode ────────────────────────────────────────────
let hlMode=false;

function setHlMode(on){
  hlMode=on;
  document.body.classList.toggle('hl-mode',on);
  const btn=$('hl-mode-btn');
  if(btn){
    btn.classList.toggle('active',on);
    btn.title=on?'關閉螢光筆':'螢光筆模式';
  }
}

$('hl-mode-btn')?.addEventListener('click',()=>setHlMode(!hlMode));

// click on <mark> while hl-mode → remove highlight
$('detail-body').addEventListener('click',async e=>{
  if(!hlMode) return;
  const mark=e.target.closest('mark');
  if(!mark) return;
  const text=mark.textContent.trim();
  if(!text) return;
  e.stopPropagation();
  const url=currentType==='podcast'
    ? `/api/episodes/${encodeURIComponent(currentItem.id)}/highlight`
    : `/api/youtube/videos/${encodeURIComponent(currentItem.id)}/highlight`;
  try{
    await api(url,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,remove:true})});
    await renderDetailNote();
  }catch(err){ console.warn('remove highlight err:',err.message); }
});

// mouseup inside detail-body while hl-mode → highlight or remove
$('detail-body').addEventListener('mouseup',async e=>{
  if(!hlMode) return;
  if(currentView!=='note') return;
  const sel=window.getSelection();
  const text=(sel?.toString()||'').trim();
  if(!text||text.length<2){ sel?.removeAllRanges(); return; }

  // detect if selection is inside a <mark> → remove mode
  let remove=false;
  if(sel.rangeCount>0){
    const range=sel.getRangeAt(0);
    const container=range.commonAncestorContainer;
    const el=container.nodeType===3?container.parentElement:container;
    remove=!!el.closest('mark');
  }

  const url=currentType==='podcast'
    ? `/api/episodes/${encodeURIComponent(currentItem.id)}/highlight`
    : `/api/youtube/videos/${encodeURIComponent(currentItem.id)}/highlight`;

  sel.removeAllRanges();
  try{
    const res=await api(url,{
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text, remove}),
    });
    if(['ok','removed','already_highlighted'].includes(res.status)) await renderDetailNote();
  }catch(err){
    console.warn('highlight err:', err.message, '| text:', text);
    if(!err.message.includes('找不到')&&!err.message.includes('422')) alert('Highlight 失敗：'+err.message);
  }
});

// ── Resize & Fullscreen ───────────────────────────────────────
(function(){
  // panel-resize: drag left edge of detail-panel to resize width
  const panelEl=$('detail-panel');
  const panelHandle=$('panel-resize');
  let panelDragging=false, panelStartX=0, panelStartW=0;
  panelHandle.addEventListener('mousedown',e=>{
    panelDragging=true;
    panelStartX=e.clientX;
    panelStartW=panelEl.offsetWidth;
    panelHandle.classList.add('dragging');
    document.body.style.userSelect='none';
    document.body.style.cursor='ew-resize';
    e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(!panelDragging) return;
    const dx=panelStartX-e.clientX; // dragging left = wider
    const newW=Math.min(window.innerWidth, Math.max(320, panelStartW+dx));
    panelEl.style.width=newW+'px';
  });
  document.addEventListener('mouseup',()=>{
    if(!panelDragging) return;
    panelDragging=false;
    panelHandle.classList.remove('dragging');
    document.body.style.userSelect='';
    document.body.style.cursor='';
  });

  // tp-resize: drag left edge of tp-panel to resize transcript width
  const tpEl=$('tp-panel');
  const tpHandle=$('tp-resize');
  let tpDragging=false, tpStartX=0, tpStartW=0;
  tpHandle.addEventListener('mousedown',e=>{
    tpDragging=true;
    tpStartX=e.clientX;
    tpStartW=tpEl.offsetWidth;
    tpHandle.classList.add('dragging');
    document.body.style.userSelect='none';
    document.body.style.cursor='ew-resize';
    e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(!tpDragging) return;
    const dx=tpStartX-e.clientX; // dragging left = wider
    const maxW=panelEl.offsetWidth-200;
    const newW=Math.min(maxW, Math.max(160, tpStartW+dx));
    tpEl.style.width=newW+'px';
  });
  document.addEventListener('mouseup',()=>{
    if(!tpDragging) return;
    tpDragging=false;
    tpHandle.classList.remove('dragging');
    document.body.style.userSelect='';
    document.body.style.cursor='';
  });

  // fullscreen toggle
  const expandBtn=$('detail-expand');
  let isFullscreen=false;
  let savedWidth='';
  expandBtn.addEventListener('click',()=>{
    isFullscreen=!isFullscreen;
    if(isFullscreen){
      savedWidth=panelEl.style.width;
      panelEl.style.width='';
      panelEl.classList.add('fullscreen');
    }else{
      panelEl.classList.remove('fullscreen');
      panelEl.style.width=savedWidth;
    }
    expandBtn.textContent=isFullscreen?'⊡':'⛶';
    expandBtn.title=isFullscreen?'縮小':'全螢幕';
  });

  // reset panel width when closed
  $('detail-close').addEventListener('click',()=>{ isFullscreen=false; panelEl.classList.remove('fullscreen'); expandBtn.textContent='⛶'; },true);
})();

init();
</script>
