<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Podcast Note</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #22253a;
  --border: #2e3145;
  --accent: #7c6af7;
  --accent-dim: #2e2860;
  --text: #e2e4f0;
  --text-dim: #8b8fa8;
  --text-muted: #555870;
  --green: #4ade80;
  --yellow: #fbbf24;
  --red: #f87171;
  --blue: #60a5fa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 360px;
  min-height: 200px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 13px;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.header-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 14px;
}
.header-title .icon { font-size: 18px; }
.server-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
  flex-shrink: 0;
}
.server-dot.online { background: var(--green); }
.server-dot.offline { background: var(--red); }
.settings-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-dim);
  padding: 4px;
  border-radius: 4px;
  display: flex;
  align-items: center;
}
.settings-btn:hover { background: var(--surface2); color: var(--text); }

/* Main content */
.content { padding: 16px; }

/* State: not on YouTube */
.state-msg {
  text-align: center;
  padding: 24px 16px;
  color: var(--text-dim);
  line-height: 1.6;
}
.state-msg .emoji { font-size: 32px; margin-bottom: 8px; }

/* Video card */
.video-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 12px;
}
.video-thumb {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  background: var(--surface2);
  display: block;
}
.video-info { padding: 10px 12px; }
.video-title {
  font-size: 12px;
  font-weight: 600;
  line-height: 1.4;
  margin-bottom: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.video-channel {
  font-size: 11px;
  color: var(--text-dim);
}

/* Status badges */
.status-row {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.badge {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 4px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 4px;
}
.badge-transcript { background: #1a2535; color: var(--blue); }
.badge-note { background: #1a3a25; color: var(--green); }
.badge-pending { background: #2a2000; color: var(--yellow); }

/* Buttons */
.btn {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover:not(:disabled) { background: #6b5ce7; }
.btn-secondary {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover:not(:disabled) { background: #2a2d45; }
.btn + .btn { margin-top: 8px; }

/* Progress bar */
.progress-wrap {
  margin-bottom: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}
.progress-phase {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}
.progress-bar-bg {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width .4s ease;
}
.progress-log {
  margin-top: 6px;
  font-size: 10px;
  color: var(--text-muted);
  max-height: 48px;
  overflow-y: auto;
  line-height: 1.5;
}

/* Note preview */
.note-preview {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 12px;
  max-height: 180px;
  overflow-y: auto;
}
.note-preview h4 {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 700;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.note-tldr {
  font-size: 11px;
  line-height: 1.6;
  color: var(--text-dim);
}
.note-tldr strong { color: var(--text); }

/* Error */
.error-msg {
  font-size: 11px;
  color: var(--red);
  padding: 8px;
  background: rgba(248,113,113,.08);
  border-radius: 6px;
  margin-bottom: 10px;
}

/* Open server link */
.open-server-link {
  text-align: center;
  margin-top: 10px;
}
.open-server-link a {
  font-size: 11px;
  color: var(--accent);
  text-decoration: none;
}
.open-server-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="header">
  <div class="header-title">
    <span class="icon">🎙</span>
    <span>Podcast Note</span>
    <span class="server-dot" id="serverDot"></span>
  </div>
  <button class="settings-btn" id="settingsBtn" title="設定">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
  </button>
</div>

<div class="content" id="content">
  <div class="state-msg">
    <div class="emoji">⏳</div>
    <div>載入中...</div>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
