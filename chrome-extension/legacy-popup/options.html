<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Podcast Note — 設定</title>
<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #22253a;
  --border: #2e3145; --accent: #7c6af7; --text: #e2e4f0;
  --text-dim: #8b8fa8; --green: #4ade80; --red: #f87171;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 14px;
  padding: 32px;
  max-width: 480px;
}
h1 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.subtitle {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 28px;
}
.field {
  margin-bottom: 20px;
}
label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 6px;
}
input[type="number"],
input[type="text"] {
  width: 100%;
  padding: 9px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  outline: none;
}
input:focus { border-color: var(--accent); }
.hint {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
}
.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 24px;
}
.btn {
  padding: 9px 20px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #6b5ce7; }
.btn-test {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-test:hover { background: #2a2d45; }
.status-msg {
  margin-top: 14px;
  font-size: 12px;
  padding: 8px 12px;
  border-radius: 6px;
  display: none;
}
.status-msg.ok { background: rgba(74,222,128,.08); color: var(--green); display: block; }
.status-msg.err { background: rgba(248,113,113,.08); color: var(--red); display: block; }

hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
.section-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 14px;
}
</style>
</head>
<body>
<h1>🎙 Podcast Note</h1>
<div class="subtitle">Chrome Extension 設定</div>

<div class="section-title">Server 連線</div>

<div class="field">
  <label>Server Port</label>
  <input type="number" id="serverPort" value="7654" min="1024" max="65535">
  <div class="hint">本地 FastAPI server 的 port，預設 7654</div>
</div>

<hr>

<div class="section-title">Obsidian 整合</div>

<div class="field">
  <label>Vault 名稱</label>
  <input type="text" id="vaultName" value="arthurwang_DB" placeholder="arthurwang_DB">
  <div class="hint">用於產生 obsidian:// 連結開啟筆記</div>
</div>

<div class="btn-row">
  <button class="btn btn-primary" id="saveBtn">儲存</button>
  <button class="btn btn-test" id="testBtn">測試連線</button>
</div>
<div class="status-msg" id="statusMsg"></div>

<script src="options.js"></script>
</body>
</html>
